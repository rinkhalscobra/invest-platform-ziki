# Hosted Edge Function schedules are configured with pg_cron and pg_net.
# The Supabase CLI does not support schedule keys in function configuration.

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions.admin-user-management]
# The function verifies the bearer token and database admin role itself. Keeping
# gateway verification off ensures unauthenticated browser OPTIONS preflight works.
verify_jwt = false

[functions.cfd-market-data]
# Browser preflight is public; the function validates the user JWT internally.
verify_jwt = false

[functions.scheduled-market-sync]
# pg_cron calls this worker without a user JWT. API-credit protection is
# enforced by the atomic refresh lease inside cfd-market-data.
verify_jwt = false

[functions.market-stream]
# Browser WebSocket clients authenticate in their first encrypted socket frame.
verify_jwt = false
